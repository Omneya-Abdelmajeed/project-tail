<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eclipse Jewelry</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#F9FAFB] text-gray-800 font-sans min-h-screen">

  <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
      
     <a href="index.html" class="flex flex-col items-start select-none">
        <span class="text-3xl font-normal tracking-[0.15em] text-black" style="font-family: 'Playfair Display', Georgia, serif;">ECLIPSE</span>
        <span class="text-[9px] tracking-[0.45em] text-gray-500 -mt-1 pl-1">JEWELRY</span>
      </a>

      <div id="nav-actions" class="flex items-center gap-6 text-sm">
        </div>

    </div>
  </header>

  <section class="max-w-7xl mx-auto px-4 mt-8">
  <div class="max-w-6xl mx-auto px-4 py-8">
  
  <form id="search-form" class="flex items-center gap-4 mb-10 w-full">
    <select id="search-type" class="border border-gray-300 rounded px-4 py-2.5 text-sm text-gray-600 bg-white focus:outline-none focus:border-blue-500 w-64 cursor-pointer">
      <option value="name">Search by Product Name</option>
      <option value="category">Search by Category</option>
    </select>

    <input id="search-input" type="text" placeholder="Search..." class="flex-grow border border-gray-300 rounded px-4 py-2.5 text-sm text-gray-700 focus:outline-none focus:border-blue-500">

    <button type="submit" class="bg-[#343A40] hover:bg-black text-white px-8 py-2.5 rounded text-sm font-medium transition duration-200">
      Search
    </button>
  </form>

  <div id="product-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 w-full">
    </div>

</div>
  </section>

  <main class="max-w-7xl mx-auto px-4 py-12">
    <div id="product-grid" class="grid grid-cols-1 md:grid-cols-3 gap-8 max-w-6xl mx-auto">
      </div>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
