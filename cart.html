<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart - Eclipse Jewelry</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-white min-h-screen flex flex-col font-sans">

  <header class="bg-white sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-12 py-6 flex justify-between items-center">
      
      <a href="index.html" class="flex flex-col items-start select-none">
        <span class="text-3xl font-normal tracking-[0.15em] text-black" style="font-family: 'Playfair Display', Georgia, serif;">ECLIPSE</span>
        <span class="text-[9px] tracking-[0.45em] text-gray-500 -mt-1 pl-1">JEWELRY</span>
      </a>

      <div id="nav-actions">
        </div>

    </div>
  </header>

  <main class="flex-grow max-w-7xl w-full mx-auto px-12 py-10">
    
    <div id="cart-container" class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-12">
      </div>

    <div class="border-t border-gray-100 pt-10 pb-16 text-center">
      <h2 id="total-price" class="text-3xl font-semibold text-gray-900">
        Total Price: $0.00
      </h2>
    </div>

    <section class="border-t border-gray-100 pt-12 mb-16">
      <div class="flex flex-col items-center mb-12">
        <h2 class="text-3xl font-semibold text-gray-900 tracking-wide">Favorite Items</h2>
        <div class="h-[3px] w-40 bg-[#DC3545] mt-3"></div> </div>

      <div id="favorites-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-8">
        </div>
    </section>

  </main>

  <script src="js/cart.js"></script>
</body>
</html>
