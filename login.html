<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Eclipse Jewelry</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

  <header class="bg-white border-b border-gray-200 py-4">
    <div class="max-w-7xl mx-auto px-10 flex items-center justify-between">
      <a href="index.html" class="flex flex-col items-start select-none">
        <h1 class="text-3xl font-light tracking-[0.2em] uppercase text-black">Eclipse</h1>
        <span class="text-[9px] uppercase tracking-[0.5em] text-gray-500 -mt-1">Jewelry</span>
      </a>
    </div>
  </header>

  <main class="flex-grow flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-4xl bg-[#F8FAFC] border border-gray-100 rounded-2xl shadow-sm p-10 md:p-14">
      
      <form id="login-form" class="space-y-6">
        <div>
          <label for="email" class="block text-sm text-gray-600 mb-2">Email</label>
          <input 
            type="email" 
            id="email" 
            placeholder="Enter email" 
            required
            class="w-full border border-gray-300 rounded-md px-4 py-3 text-sm focus:outline-none focus:border-gray-400 bg-white"
          >
        </div>

        <div>
          <label for="password" class="block text-sm text-gray-600 mb-2">Password</label>
          <input 
            type="password" 
            id="password" 
            placeholder="Enter password" 
            required
            class="w-full border border-gray-300 rounded-md px-4 py-3 text-sm focus:outline-none focus:border-gray-400 bg-white"
          >
        </div>

        <div class="flex items-center gap-2">
          <input 
            type="checkbox" 
            id="remember" 
            class="w-4 h-4 rounded border-gray-300 text-blue-600 focus:ring-0 cursor-pointer"
          >
          <label for="remember" class="text-sm text-gray-600 select-none cursor-pointer">Remember Me</label>
        </div>

        <div>
          <button 
            type="submit" 
            id="sign_in" 
            class="bg-[#007BFF] hover:bg-blue-600 text-white font-medium px-6 py-2.5 rounded-md text-sm transition focus:outline-none"
>
            Login
          </button>
        </div>
      </form>

      <div class="mt-6 text-sm text-gray-600">
        Don't have an account? 
        <a href="register.html" class="text-[#007BFF] hover:underline">Register</a>
      </div>

    </div>
  </main>

  <script src="js/login.js" defer></script>
</body>
</html>
